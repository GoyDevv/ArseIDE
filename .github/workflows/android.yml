name: Android CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle Build Files
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set Commit Message
        run: |
          {
            echo "COMMIT_MSG<<ARSEEOF"
            git log -1 --pretty=%B
            echo "ARSEEOF"
          } >> "$GITHUB_ENV"

      - name: Clone submodules
        run: git submodule update --init --recursive

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Arse IDE (release)
        run: ./gradlew assemblePro --build-cache --no-daemon && mv app/build/outputs/apk/pro/*.apk "app/ArseIDE-${{ env.COMMIT_HASH }}.apk"
        continue-on-error: false

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: Arse-IDE
          path: app/ArseIDE-${{ env.COMMIT_HASH }}.apk

      - name: Publish Arse IDE Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/ArseIDE-${{ env.COMMIT_HASH }}.apk"
          tag: "arse-ide-latest"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          name: "Arse IDE — Latest Build"
          bodyFile: "changelog-4.2.1.txt"
          token: ${{ secrets.GITHUB_TOKEN }}